[project]
name = "practice-attendance"
version = "0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.1",
    "icalendar>=7.3.0",
    "recurring-ical-events>=3.8.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
practice-attendance = "practice_attendance.server:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mdformat>=1.0.0",
    "mdformat-frontmatter>=2.1.2",
    "mdformat-gfm>=1.0.0",
    "pre-commit>=4.7.0",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
